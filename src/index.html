<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кухня — Аквариум</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #172332;
      color: #f8ead6;
      font-family: system-ui, sans-serif;
    }

    .kitchen {
      position: relative;
      width: min(900px, 100%);
      height: min(620px, 100vh);
      min-height: 480px;
      overflow: hidden;
      background:
        linear-gradient(#172b45 0 48%, transparent 48%),
        linear-gradient(90deg, #a96037 0 5%, #f2c28c 5% 7%, #362b2b 7% 93%, #f2c28c 93% 95%, #a96037 95%);
      border: 10px solid #6b3e2b;
      box-shadow: 0 20px 70px #0008;
    }

    .window {
      position: absolute;
      top: 9%;
      left: 14%;
      width: 72%;
      height: 48%;
      border: 12px solid #70452f;
      background:
        radial-gradient(circle at 72% 62%, #ffd68a 0 3px, transparent 4px),
        radial-gradient(circle at 35% 72%, #ffd68a 0 4px, transparent 5px),
        linear-gradient(#203450, #647492);
      box-shadow: inset 0 0 30px #f8c98955;
    }

    .window::after {
      content: "❄";
      position: absolute;
      inset: 0;
      color: #fff9;
      font-size: 30px;
      letter-spacing: 24px;
      text-align: center;
      padding-top: 20px;
      animation: snow 5s linear infinite;
    }

    @keyframes snow {
      from { transform: translateY(-15px); }
      to { transform: translateY(25px); }
    }

    .counter {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 26%;
      background: linear-gradient(#d4a26c 0 18%, #805137 18% 100%);
      border-top: 8px solid #f1cb98;
    }

    .shelf {
      position: absolute;
      top: 4%;
      left: 4%;
      width: 92%;
      height: 12px;
      background: #805137;
      box-shadow: 0 8px #d5a06a;
    }

    .cups {
      position: absolute;
      top: 0;
      left: 18%;
      font-size: clamp(24px, 5vw, 42px);
      letter-spacing: 12px;
    }

    .kettle {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 23%;
      transform: translateX(-50%);
      width: 150px;
      height: 115px;
      border: 5px solid #8a4d32;
      border-radius: 48% 48% 38% 38%;
      background: linear-gradient(110deg, #d58b62, #f4c28d 50%, #a9533e);
      box-shadow: inset -12px -8px 15px #713a2c66, 0 12px 18px #3b241d66;
    }

    .kettle::before {
      content: "";
      position: absolute;
      width: 58px;
      height: 40px;
      border: 10px solid #8a4d32;
      border-left-color: transparent;
      border-radius: 50%;
      right: -45px;
      top: 28px;
    }

    .kettle::after {
      content: "";
      position: absolute;
      width: 38px;
      height: 24px;
      background: #d58b62;
      clip-path: polygon(0 35%, 100% 0, 75% 100%);
      left: -30px;
      top: 30px;
    }

    .button {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: #8c4b45;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .button:focus-visible { outline: 3px solid white; }

    .steam {
      position: absolute;
      left: 50%;
      bottom: 43%;
      display: flex;
      gap: 18px;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity .5s;
    }

    .steam span {
      width: 8px;
      height: 42px;
      border-radius: 50%;
      background: #fff9;
      filter: blur(5px);
      animation: rise 1.5s ease-in-out infinite alternate;
    }

    .steam span:nth-child(2) { animation-delay: .4s; }
    .steam span:nth-child(3) { animation-delay: .8s; }

    .on .steam { opacity: 1; }

    @keyframes rise {
      to { transform: translateY(-18px) scaleY(1.3); }
    }

    .status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5%;
      text-align: center;
      color: #fff0dc;
    }

    @media (max-width: 520px) {
      .kitchen { min-height: 100vh; }
      .window { height: 40%; }
      .kettle { transform: translateX(-50%) scale(.8); }
    }
    .kitchen {
  width: min(720px, 100%);
  height: auto;
  min-height: 0;
  aspect-ratio: 720 / 844;
  background: url("images/kitchen.jpg") center / cover;
  border: 0;
}
.window, .shelf, .cups, .counter, .kettle, .status {
  display: none;
}
.steam {
  left: 72%;
  bottom: 52%;
}
.button {
  bottom: 3%;
  z-index: 3;
}
  </style>
</head>
<body>
  <main class="kitchen" id="kitchen">
    <div class="window" aria-label="Снежное окно"></div>
    <div class="shelf"></div>
    <div class="cups" aria-hidden="true">☕ 🌼 ☕</div>
    <div class="counter"></div>

    <div class="steam" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="kettle" aria-label="Чайник"></div>

    <button class="button" id="switch">Поставить чайник</button>
    <div class="status" id="status" aria-live="polite">На кухне тихо. За окном идёт снег.</div>
  </main>

  <script>
    const kitchen = document.querySelector("#kitchen");
    const button = document.querySelector("#switch");
    const status = document.querySelector("#status");
    let isOn = false;

    button.addEventListener("click", () => {
      isOn = !isOn;
      kitchen.classList.toggle("on", isOn);
      button.textContent = isOn ? "Выключить чайник" : "Поставить чайник";
      status.textContent = isOn
        ? "Чайник греется. Скоро можно будет налить чай."
        : "На кухне тихо. За окном идёт снег.";
    });
  </script>
</body>
</html>
